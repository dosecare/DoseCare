<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Favorites | DoseCare</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- Background -->

    <div class="background">

        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>
        <div class="glow glow-three"></div>

        <div class="bubble bubble-one"></div>
        <div class="bubble bubble-two"></div>
        <div class="bubble bubble-three"></div>
        <div class="bubble bubble-four"></div>
        <div class="bubble bubble-five"></div>

        <div id="particles"></div>

    </div>


    <!-- Main -->

    <main class="favorites-page">

        <!-- Header -->

        <header class="page-header">

            <button
                class="back-button"
                id="back-home"
                type="button"
            >
                ←
            </button>

            <div>

                <span class="page-label">
                    DOSECARE
                </span>

                <h1>
                    Favorites
                </h1>

            </div>

        </header>


        <!-- Intro -->

        <section class="page-intro">

            <h2>
                Your favorite medicines
            </h2>

            <p>
                Quickly access the medicines
                you use most often.
            </p>

        </section>


        <!-- Favorites Container -->

        <section
            id="favorites-container"
            class="favorites-container"
        >

            <!-- JavaScript will add
                 favorite medicines here -->

        </section>


        <!-- Empty State -->

        <section
            id="empty-favorites"
            class="empty-favorites"
        >

            <div class="empty-icon">
                ★
            </div>

            <h2>
                No favorites yet
            </h2>

            <p>
                Add medicines to your favorites
                and they will appear here.
            </p>

            <button
                id="browse-medicines"
                class="primary-button"
                type="button"
            >
                Browse Medicines
                <span>→</span>
            </button>

        </section>

    </main>


    <script src="favorites.js"></script>

</body>

</html>
