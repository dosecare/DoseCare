<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DoseCare — History</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="stylesheet"
        href="history.css"
    >

</head>


<body>


    <!-- =================================
         BACKGROUND
    ================================= -->

    <div class="background">

        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>
        <div class="glow glow-three"></div>

        <div class="bubble bubble-one"></div>
        <div class="bubble bubble-two"></div>
        <div class="bubble bubble-three"></div>
        <div class="bubble bubble-four"></div>
        <div class="bubble bubble-five"></div>

        <div id="particles"></div>

    </div>



    <!-- =================================
         HISTORY PAGE
    ================================= -->

    <main class="history-page">


        <!-- HEADER -->

        <header class="history-header">

            <button
                id="back-button"
                class="history-back"
                type="button"
            >
                ←
            </button>


            <div>

                <span class="history-label">
                    DOSECARE
                </span>

                <h1>
                    Calculation History
                </h1>

                <p>
                    Review your previous
                    pediatric dose calculations.
                </p>

            </div>


            <button
                id="clear-history"
                class="clear-history"
                type="button"
            >
                Clear History
            </button>

        </header>



        <!-- COUNT -->

        <div class="history-summary">

            <span>
                Recent calculations
            </span>

            <strong id="history-count">
                0 calculations
            </strong>

        </div>



        <!-- HISTORY LIST -->

        <section
            id="history-list"
            class="history-list"
        ></section>



        <!-- EMPTY STATE -->

        <section
            id="history-empty"
            class="history-empty"
        >

            <div class="empty-icon">
                ◷
            </div>

            <h2>
                No calculations yet
            </h2>

            <p>
                Your completed dose calculations
                will appear here automatically.
            </p>

            <button
                id="go-calculator"
                class="primary-button"
                type="button"
            >
                Start Dose Calculator
                <span>→</span>
            </button>

        </section>


    </main>



    <script src="history.js"></script>

</body>

</html>
